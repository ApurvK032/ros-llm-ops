[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-agent"
version = "0.0.1"
description = "Local-model warehouse task supervisor for ROS 2, Nav2 and Gazebo"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Apurv Kushwaha"}]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["hypothesis>=6.100"]

[project.scripts]
warehouse-agent = "warehouse_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["warehouse_agent*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Pyflakes, core pycodestyle errors, bugbear, pyupgrade, whitespace and import order.
select = ["E4", "E7", "E9", "F", "B", "UP", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Copied unchanged from WarehouseBot; keep it byte-identical to the original.
"warehouse_agent/astar.py" = ["UP", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["warehouse_agent"]
