[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-agent"
version = "0.0.1"
description = "Local-model warehouse task supervisor for ROS 2, Nav2 and Gazebo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
warehouse-agent = "warehouse_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["warehouse_agent*"]
