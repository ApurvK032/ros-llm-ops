name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is ROS 2 Jazzy's interpreter on Ubuntu 24.04; 3.14 is the development interpreter.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install "hypothesis==6.168.3"
      - name: Unit and property-based tests (no ROS, GPU or model required)
        run: python -B -m unittest discover -s tests -v

  ros:
    name: ROS 2 Jazzy workspace
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v7
      - name: Build ros_ws with colcon
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros_ws
          colcon build --event-handlers console_direct+
      - name: ROS tests (typed messages against the real supervisor)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros_ws/install/setup.bash
          python3 -B -m unittest discover -s tests_ros -v

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff (pinned to match local runs)
        run: python -m pip install ruff==0.16.9
      - name: Ruff
        run: ruff check --output-format=github .
